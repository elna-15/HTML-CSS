<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
           border: 1px solid black;
           width: 180px;
           background-color: bisque;
           padding: 20px;
           text-align: center;
           margin: 50px auto;
           border-radius: 10px;
           box-shadow: 2px -1px 11px gray;
        }
        img{
            width: 100%;
        }
        button{
            border-radius: 10px;
            padding: 8px;
            margin-top: 23px;
            background-color: beige;
            
        }
        p{
            margin-bottom: -16px;
        }
        h2{
            margin-bottom: -16px;
        }
        
    </style>
</head>
<body>
    <div>
      <img src="./image.png">
      <h2>Headphone</h2>
      <p>&#8377; 3500</p>
      <button>Buy Now</button>
    </div>
</body>
</html>
