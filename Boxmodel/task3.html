<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 1px solid purple;
            width:250px;
            height:400px;
            padding: 15px;
            font-family: Arial, Helvetica, sans-serif;
            margin: 50px auto;
            border-radius: 9px;
            text-align: center;
            padding-right: 15px;
            
        }
        img{
            height:180px;
            width: 180px;
            border-radius: 50%;
            margin-left: 15px;
        }
        h2{
            color: purple;
            text-align: center;

        }
        p{
            text-align: center;
        }
        pre{
            color: purple;
            text-align: center;
        }
        button{
            text-align: center;
            background-color: purple;
            color: white;
            border-radius: 9px;
            border-color: transparent;
        }
    </style>
</head>
<body>
    <div>
    <img src="./face.avif">
    <h2>Rahul Kumar</h2>
    <p>Web Developer</p>
    <hr>
    <pre>HTML | CSS | JavaScript</pre>
    <button>Contact Us</button>


    </div>
</body>
</html>
