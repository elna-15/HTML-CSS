<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 1px solid black;
            border-radius: 9px;
            width:500px;
            height: 250px;
            padding: 20px ;
            background-color: lightgoldenrodyellow;
            font-family: Arial, Helvetica, sans-serif;
            margin: 50px auto;
            box-shadow: 20%;
        }
        img{
            width:300px;
            height:200px;
        }
        p{
            color: green;
            font-weight: bold;

        }
        button{
            background-color: black;
            color: white;
            border-radius: 7px;
            border-color: transparent;
            padding: 10px;
        }
        .line{
            padding: 22px;
        }
    </style>
</head>
<body>
    <div>
        <table>
            <tr>
                <td><img src="./shoe.jpg"></td>
                <td class="line">
                    <h2>Sports Shoes</h2>
                    <pre>Comfortable and Stylish 
shoes for everyday use. </pre>
                    <p>&#8377; 1,499</p>
                    <button>Add to Cart</button>
                </td>

            </tr>
        </table>
    </div>
</body>
</html>
