<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            
            border:2px solid grey;
            width: 280px;
            
            border-radius: 10px;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            box-shadow: 2px 3px 4px gray;
        }
        img{
            width: 100%;

        }
        p{
            color: green;
        }
        section{
            padding: 10px;
            display: none;
            
        }
        button{
            width: 100%;
            background-color: blue;
            color: white;
            border: 2px solid blue;
            border-radius: 8px;
            padding: 8px;
            font-size: 25px;
        }
        div:hover section{
            display: block;
        }
        
    </style>

</head>
<body>
    <div>
        <img src="./headphone.avif">
        <section>
            <h1>Headphone</h1>
            <p>&#8377; 3999</p>
            <button>Buy Now</button>
        </section>
    </div>
</body>
</html>
