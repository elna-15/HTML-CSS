<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            border: 2px solid red;
            display: flex;
            justify-content: space-around;
            background-color: black;
            padding: 15px;
            align-items: center;
        }
        .logo{
            color: white;
        }
        .menu{
            border: 2px solid green;

            display: flex;
            width: 300px;
            justify-content: space-between;
        }
        .menu>a{
            color: white;
            text-decoration: none;

        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">My Website</div>
        <div class="menu">
            <a href="">Home</a>
            <a href="">Courses</a>
            <a href="">Placements</a>
            <a href="">Fee</a>
        </div>
    </nav>
</body>
</html>
