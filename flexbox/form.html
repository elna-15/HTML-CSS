<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
        }
        body{
            /* border: 2px solid orange; */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: beige;
        }
        h2{
            margin-bottom: 10px;
            color: green;
            font-size: 18px;
        }
        form{
            border: 0.5px solid gray;
            width: 300px;
            padding: 10px;
            border-radius: 9px;
            background-color: white;
        }
        div{
            /* border: 2px solid green; */
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;

        }
       button{
        width: 100%;
        background-color: green;
        color: white;
        padding: 4px 0px;
        border: none;
        font-size: 13px;
        border-radius: 10px;
        margin-top: 7px;
       }
       input{
        outline: none;
        padding: 2px;
        border-radius: 8px;
        border: 0.5px solid blue;
       }
    </style>
</head>
<body>
    <h2>Welcome Back to Instagram</h2>
    <form >
        <div>
            <label>Username:</label>
            <input type="text">

        </div>
        <div>
            <label>Password:</label>
            <input type="text">
        </div>
        <div><button>Login</button></div>
    </form>
</body>
</html>
