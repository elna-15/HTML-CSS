<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            display: flex;
            border: 2px solid gray;
            align-items: center;
            background-color: black;
            color: white;
            gap: 10px;
            padding: 4px;
        }
        div{
            /* border: 2px solid red; */
        }
        .logo{
            font-size: 20px;
            font-weight: bold;
            color: orangered;
        }
        .search input{
            padding: 3px 0px 3px 5px;
            outline: none;
            border: 1px solid grey;
            border-radius: 3px;
            width: 100%;
        }
        button{
            padding: 3px 6px;
            background-color: orange;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .search{
            flex-grow: 1;
        }
       

    </style>
</head>
<body>
    <nav>
        <div class="logo">QSpiders</div>
        <div class="search">
            <input type="text" placeholder="Search Courses...">
        </div>
        <div class="btn">
            <button>Explore</button>
        </div>
    </nav>
</body>
</html>
