<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html forms</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form>
      <label for="">Full Name:</label>
      <input type="text">
      <br><br>
      <label for="">Password:</label>
      <input type="password">
      <br><br>
      <label for="">Email:</label>
      <input type="email">
      <br><br>
      <label for="">Age:</label>
      <input type="number">
      <br><br>
      <label for="">Mobile:</label>
      <input type="tel">
      <br><br>
      <label for="">Date Of Birth:</label>
      <input type="date">
      <br><br>
      <label for="">Interview Date and time:</label>
      <input type="datetime-local">
      <br><br>
      <label for="">Joining Month:</label>
      <input type="month">
      <br><br>
      <label for="">Joining week:</label>
      <input type="week">
      <br><br>
      <label for="">Upload Resume:</label>
      <input type="file">
      <br><br>
      <label for="">Portfolio Website:</label>
      <input type="url">
      <br><br>
      <label for="">Favourite color:</labelf>
      <input type="color">
      <br><br>
      <label for="">Search Courses:</label>
      <input type="search">
      <br><br>
      <label for="">Gender:</label>
      <input type="radio" name="kochi" >Male
      <input type="radio" name="kochi">Female
      <input type="radio" name="kochi">Others
      <br><br>
      <label for="">Skills:</label>
      <input type="checkbox">HTML
      <input type="checkbox">CSS
      <input type="checkbox">JS
      <input type="checkbox">React
      <br><br>
      <label for="">Skill Range:</label>
      <input type="range">
      <br><br>
      <label for="">Address:</label>
      <textarea cols="20" rows="5"></textarea>
      <br><br>
      <button>Submit</button>
    </form>
</body>
</html>
