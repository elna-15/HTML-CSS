<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label>Select Travel Class:</label>
        <select>
            <option value=""></option>
            <option value="">Economy</option>
            <option value="">Premium Economy</option>
            <option value="">Business</option>
            <option value="">First Class</option>
        </select>
        <br><br>
       <label>Select Food:</label>
       <select>
        <option value=""></option>
         <option>Biriyani</option>
         <option value="">Pizza</option>
         <option value="">Burgers</option>
         <option value="">South Indian</option>
         <option value="">Desserts</option>
       </select>
       <br><br>
       <label>Choose a model:</label>
       <select>
        <option></option>
       <optgroup label="Apple">
          <option value="">iPhone15</option>
          <option value="">iPhone15 Pro</option>
          <option value="">iPhone 16</option>
       </optgroup>
       <optgroup label="Samsung">
          <option value="">Galaxy S25</option>
          <option value="">Galaxy A56</option>
          <option value="">Galaxy Z Fold</option>

       </optgroup>
       <optgroup label="OnePlus">
        <option value="">OnePlus13</option>
        <option value="">OnePlus Nord 5</option>
        <option value="">OnePlus 13R</option>
       </optgroup>
       </select>
       <br><br>
       <label>Search College:</label>
       <input type="text" list="hi">
       <datalist id="hi">
         <option value="IIT Bombay"></option>
         <option value="IIT Madras"></option>
         <option value="NIT Trichy"></option>
         <option value="JNTU Hyderabad"></option>
         <option value="Andhra University"></option>
         </datalist>
       <br><br>
       <label>Cricket Player:</label>
       <input type="text" list="hey">
       <datalist id="hey">
        <option value="Virat Kohli"></option>
        <option value="Rohit Sharma"></option>
        <option value="Jasprit Bumrah"></option>
        <option value="Shubman Gill"></option>
        <option value="MS Dhoni"></option>
        <option value="Hardik Pandya"></option>
       </datalist>

       </form>
</body>
</html>
