<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        div{
            border: 2px solid red;
            width: 300px;
            height: 500px;
            margin: 50px auto;
            position: relative;

        }
        img{
            width: 100%;
            height: 250px;
        }

        span{
            background-color: blue;
            color: white;
            position: absolute;
         
            left: 5px;
            top:7px;
            font-size: 18px;
            padding: 1x 18px;
            border-radius: 8px ;
        }
        small{
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <div>
        <img src="./watch.png" alt="">
        <span>Sale</span>
        <section>
            <h2>Smart Watch Pro X</h2>
            <pre>Advanced tracking.Stylish design.
    Built for everyday.

            </pre>
        <p></p>    
         <p>&#8377; 2,999   <small>&#8377; 3,999</small></p>
         <hr></hr>
        <p>Add to Cart  <button>Buy Now</button></p>
         
        </section>
    </div>
</body>
</html>
