<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            border: 2px solid gray;
            height: 400px;
            width: 900px;
            margin: 50px auto;
            position: relative;
            background-image: url(./kerala.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }
        div{
            position: absolute;
            border: 2px solid green;
            width: 800px;
            text-align: center;
            top:149px;
            left: 53px;
            color: white;
        }
        article{
            position: absolute;
            height: 100%;
            width: 100%;
            background-color: rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <section>
    <article></article>
    <div>
        <h1>Welcome to God's Own Country</h1>
        <p>Explore the beautiful places.</p>
    </div>
    </section>
</body>
</html>
