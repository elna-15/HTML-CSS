<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            text-align: center;
            height: 400px;
            width: 600px;
            border-collapse: collapse;
            border-color: black;
    
        }
        th{
            background-color: plum;
        }
    </style>
</head>
<body>
    <table border="2" align="center">

            <th >Student</th>
            <th >Subject</th>
            <th >Marks</th>
        </tr>

            <td rowspan="3">Alice</td>
            <td>Maths</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>90</td>
            
        </tr>
        <tr>
            <td>English</td>
            <td>78</td>
           
        </tr>
        <tr>
            <td rowspan="3">Bob</td>
            <td>Maths</td>
            <td>88</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>92</td>
        </tr>
    </table>
</body>
</html>
